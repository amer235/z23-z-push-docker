name: build

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # jeden Montag 04:17 UTC: Rebuild für Sicherheitsupdates
  workflow_dispatch:        # manuell über "Run workflow"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Z-Push-Version aus Dockerfile lesen
        id: v
        run: echo "zpush=$(grep -oP '^ARG ZPUSH_VERSION=\K.*' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/amer235/z-push:${{ steps.v.outputs.zpush }}
            ghcr.io/amer235/z-push:latest
            ghcr.io/amer235/z-push:sha-${{ github.sha }}
